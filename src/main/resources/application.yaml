server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: Practica

  # Desactivar Flyway (no necesario con H2)
  flyway:
    enabled: false

  # Base de datos H2 en memoria
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Consola H2 (opcional, útil para ver los datos en el navegador)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA crea las tablas automáticamente
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
